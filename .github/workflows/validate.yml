name: Validate submissions

on:
  pull_request:
    paths:
      - "results/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all reports
        run: python scripts/validate.py
